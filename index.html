<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juju Finanças</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juju Finanças">
<meta name="theme-color" content="#FFF4F8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de banco em rosa para celular — cabeçalho fixo com o mês, telas (Início, Gastos, Brasil, Parcelas, Comparar) trocadas pelo menu fixo embaixo; botão flutuante abre a folha de lançamento. */
:root{
  --bg:#FFF4F8; --surface:#FFFFFF; --surface-2:#FDE6EF; --line:#F6CFDE;
  --fg:#3B1E2C; --muted:#8C5D72; --accent:#D63A7A; --accent-fg:#FFFFFF; --accent-soft:#FBD3E3;
  --hero-bg:#FDE1EC; --petal-a:#F7A8C8; --petal-b:#FBC7DB; --petal-c:#F6C453; --leaf:#8CC7A1;
  --in:#1F8A5B; --in-soft:#DDF3E8; --out:#C7344B; --out-soft:#FCE0E5; --warn:#B3650C; --warn-soft:#FDEFD9;
  --c1:#D63A7A; --c2:#E07A3A; --c3:#2A958A; --c4:#8B5AD6; --c5:#BE8B1E; --c6:#E2589D; --c7:#3F9B62; --c8:#8F7382;
  --shadow:0 6px 24px rgba(160,40,90,.10);
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1118; --surface:#2A1821; --surface-2:#3A222E; --line:#4E2F3F;
  --fg:#FCEAF2; --muted:#C99BB0; --accent:#FF8DBD; --accent-fg:#2A0E1B; --accent-soft:#4F2338;
  --hero-bg:#3A1F2D; --petal-a:#B4547F; --petal-b:#7E3D5C; --petal-c:#E0B04A; --leaf:#4F8A64;
  --in:#5FD39A; --in-soft:#173628; --out:#FF8C99; --out-soft:#45202A; --warn:#F5B65A; --warn-soft:#3D2B14;
  --c1:#FF8DBD; --c2:#F6A06A; --c3:#5CCFC2; --c4:#B996F5; --c5:#E9C057; --c6:#F79BC8; --c7:#76D69A; --c8:#C3A6B5;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1118; --surface:#2A1821; --surface-2:#3A222E; --line:#4E2F3F;
  --fg:#FCEAF2; --muted:#C99BB0; --accent:#FF8DBD; --accent-fg:#2A0E1B; --accent-soft:#4F2338;
  --hero-bg:#3A1F2D; --petal-a:#B4547F; --petal-b:#7E3D5C; --petal-c:#E0B04A; --leaf:#4F8A64;
  --in:#5FD39A; --in-soft:#173628; --out:#FF8C99; --out-soft:#45202A; --warn:#F5B65A; --warn-soft:#3D2B14;
  --c1:#FF8DBD; --c2:#F6A06A; --c3:#5CCFC2; --c4:#B996F5; --c5:#E9C057; --c6:#F79BC8; --c7:#76D69A; --c8:#C3A6B5;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3{text-wrap:balance}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--accent);display:flex;align-items:center;gap:6px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px}
.month button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;font-size:1.2rem;line-height:1;color:var(--accent)}
.month span{min-width:6.6em;text-align:center;font-weight:800;white-space:nowrap;font-size:.92rem}

/* menu inferior */
nav.bottom{position:fixed;z-index:8;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bottom .in-nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;font-weight:800;color:var(--muted);border-radius:14px}
nav.bottom svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom button[aria-current="page"] svg{fill:var(--accent-soft)}

#view{display:flex;flex-direction:column;gap:14px}
.notes{display:flex;flex-direction:column;gap:8px}
.note{font-size:.86rem;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.warn{background:var(--warn-soft);color:var(--fg)}
.note button{border:0;background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card > h3{margin:0 0 10px;font-family:var(--display);font-weight:600;font-size:1.08rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.link{border:0;background:transparent;color:var(--accent);font-weight:800;font-size:.86rem;padding:4px 0}
.sectitle{margin:6px 4px 0;font-family:var(--display);font-weight:600;font-size:1.1rem}
.muted{color:var(--muted)}
.in{color:var(--in)} .out{color:var(--out)} .warnc{color:var(--warn)}

/* abertura com florzinhas */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);border-radius:28px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px}
.hero .flores{position:absolute;right:-6px;top:-4px;width:150px;height:auto;opacity:.9;pointer-events:none}
.hero .hello{position:relative;font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--accent)}
.hero .hrow{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .htxt{min-width:0}
.hero .lbl{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:22px}
.hero .big{font-family:var(--display);font-weight:700;font-size:2.5rem;line-height:1.05;color:var(--fg);overflow-wrap:anywhere}
.hero .sub{font-weight:800;color:var(--muted);font-size:1rem}
.hero .sub2{font-weight:700;color:var(--muted);font-size:.86rem;margin-top:4px}
.hero .face span{background:var(--surface)}

/* ações rápidas */
.actions-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:800;color:var(--fg);text-align:center;line-height:1.15}
.qa i{width:52px;height:52px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:1.35rem;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:800;font-size:.86rem;color:var(--fg)}
.chips button b{color:var(--accent)}

/* resumo / faces */
.summary{display:flex;flex-direction:column;gap:14px}
.sumtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sumtop > div{min-width:0}
.balance{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.1;overflow-wrap:anywhere}
.balance.neg{color:var(--out)}
.conv{color:var(--muted);font-weight:700;font-size:.92rem}
.face{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:7.5em;text-align:center}
.face span{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--accent-soft);font-size:2rem;line-height:1}
.face small{font-size:.74rem;color:var(--muted);font-weight:800;line-height:1.25}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split > div{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.split strong{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.split small{display:block;color:var(--muted);font-size:.8rem}
.meter{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pending{display:flex;justify-content:space-between;gap:4px 10px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.pending b{color:var(--warn)}

/* barras de categoria */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.barrow .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .t{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barrow .t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.barrow .v{font-weight:800;white-space:nowrap;text-align:right}
.barrow .v small{display:block;color:var(--muted);font-weight:600;font-size:.74rem}

/* listas */
.day{display:flex;flex-direction:column;gap:6px}
.day h3{margin:4px 4px 0;font-size:.8rem;font-weight:800;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:left;background:transparent;border:0}
.badge{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--surface);background:var(--c8)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt small{color:var(--muted);font-size:.8rem}
.row .val{text-align:right;white-space:nowrap}
.row .val b{display:block;font-weight:800}
.row .val small{display:block;color:var(--muted);font-size:.76rem;font-weight:600}
.row.unpaid .val b{color:var(--warn)}
.row.skip .val b{color:var(--muted);text-decoration:line-through}
.row.skip .txt b{color:var(--muted)}
.chip{display:inline-block;font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.chip.fixa{background:var(--surface-2);color:var(--muted)}
.chip.ap{background:var(--warn-soft);color:var(--warn)}
.chip.late{background:var(--out-soft);color:var(--out)}
.chip.nao{background:var(--surface-2);color:var(--fg)}
.chip.parc{background:var(--accent-soft);color:var(--accent)}
.chip.ex{background:var(--surface-2);color:var(--accent)}
.paybtn{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:.85rem;font-weight:800;color:transparent}
.paybtn.on{background:var(--in);border-color:var(--in);color:var(--surface)}
.rowwrap{display:flex;align-items:center;border-top:1px solid var(--line);padding-right:12px}
.list > :first-child{border-top:0}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .big{font-size:2.2rem}
.empty h2{margin:0;font-family:var(--display);font-size:1.2rem;font-weight:600}
.empty p{margin:0;color:var(--muted);max-width:36ch}
.btn{border:0;border-radius:99px;padding:12px 20px;font-weight:800;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 12em}

/* conferência */
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent}
.issue:first-of-type{border-top:0}
.issue span.i{flex:none;font-size:1.1rem}
.issue span.t{flex:1;font-size:.88rem;font-weight:600}
.issue span.t small{display:block;color:var(--accent);font-weight:800;margin-top:2px}

/* categorias */
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:99px;padding:3px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.cat .head{display:flex;align-items:center;gap:10px}
.cat .head .badge{width:32px;height:32px;font-size:.72rem;border-radius:10px}
.cat .head span.n{flex:1;font-weight:700;min-width:0}
.cat .head .amt{text-align:right;white-space:nowrap}
.cat .head .amt b{display:block}
.cat .head .amt small{display:block;color:var(--muted);font-size:.78rem}
.cat .head .mood{font-size:1.3rem}
.cat .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.cat .meta button{border:0;background:transparent;color:var(--accent);font-weight:800;font-size:.8rem;padding:2px 0;white-space:nowrap}
.cat .meter i.over{background:var(--out)}
.cat .meter i.near{background:var(--warn)}
.inlineform{display:flex;gap:8px}
.inlineform input{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 14px}
.search input{border:0;background:transparent;padding:8px 0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
.search button{border:0;background:var(--surface-2);border-radius:50%;width:30px;height:30px;flex:none}

/* tabelas e gráfico */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th:first-child{background:var(--surface-2)}
td:first-child{font-weight:800}
tr.cur td,tr.cur td:first-child{background:var(--accent-soft)}
td.face1{font-size:1.15rem;text-align:center}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{font-size:.86rem;font-weight:700;margin-top:6px;min-height:1.3em}
.headline{display:flex;gap:12px;align-items:center}
.headline p{margin:0;font-weight:700}
.headline p small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.cmpcat{display:flex;flex-direction:column}
.cmprow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cmprow:first-child{border-top:0}
.cmprow .n{flex:1;min-width:0;font-weight:700}
.cmprow .n small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.cmprow .d{font-weight:800;white-space:nowrap;font-size:.86rem}

.fab{position:fixed;z-index:7;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:99px;padding:14px 20px;font-weight:800;font-size:1rem;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 22px rgba(160,30,90,.35)}

/* folhas */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(40,10,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-size:1.35rem;font-weight:600}
.sheet .bar{display:flex;justify-content:space-between;align-items:center}
.sheet .bar button{border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;font-size:1.1rem}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.toggle.three{grid-template-columns:1fr 1fr 1fr}
.toggle button{border:0;background:transparent;border-radius:11px;padding:10px 4px;font-weight:800;color:var(--muted);font-size:.9rem}
.toggle button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(120,30,70,.12)}
.toggle button.on.o{background:var(--out-soft);color:var(--out)}
.toggle button.on.i,.toggle button.on.p{background:var(--in-soft);color:var(--in)}
.toggle button.on.a{background:var(--warn-soft);color:var(--warn)}
.toggle.small button{padding:8px 4px;font-size:.86rem}
.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:800;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2 > *{min-width:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],input[inputmode]{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.money{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.money span{font-weight:800;color:var(--muted);font-size:1.2rem}
.money input{border:0;background:transparent;padding:6px 0;font-family:var(--display);font-weight:600;font-size:2rem}
.money input:focus{outline:none}
.money:focus-within{border-color:var(--accent)}
.hint{margin:-6px 2px 0;font-size:.85rem;color:var(--muted);min-height:1.2em}
.trocabox{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.trocabox .ttl{font-weight:800;font-size:.9rem}
.trocabox .ttl small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.prefix{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.prefix span{font-weight:800;color:var(--muted);white-space:nowrap;font-size:.9rem}
.prefix input{border:0;background:transparent;padding:11px 0}
.prefix input:focus{outline:none}
.prefix:focus-within{border-color:var(--accent)}
.catgroup{display:flex;flex-direction:column;gap:6px}
.catgroup > span{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.catpick{display:flex;flex-wrap:wrap;gap:8px}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span aria-hidden="true">🌸</span>Juju Finanças</div>
    <div class="month">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <span id="monthLabel">—</span>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
  </header>
  <div id="view"><div class="empty"><p>Carregando…</p></div></div>
</div>

<button class="fab" id="fab">+ Lançar</button>
<nav class="bottom" aria-label="Menu">
  <div class="in-nav">
    <button id="tab-I" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button id="tab-G"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Gastos</button>
    <button id="tab-B"><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/><circle cx="12" cy="12" r="3"/></svg>Brasil</button>
    <button id="tab-P"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg>Parcelas</button>
    <button id="tab-C"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Comparar</button>
  </div>
</nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(() => {
"use strict";
const AR = "lancamentos", BR = "brasil";

// ---------- categorias ----------
const GROUPS_AR = [
  {t:"Casa", cats:[{k:"aluguel",n:"Aluguel",c:"--c1"},{k:"condominio",n:"Condomínio (expensas)",c:"--c4"},{k:"luz",n:"Luz",c:"--c5"},{k:"agua",n:"Água (AySA)",c:"--c3"},
    {k:"gas",n:"Gás",c:"--c2"},{k:"internet",n:"Internet",c:"--c4"},{k:"abl",n:"ABL",c:"--c8"}]},
  {t:"Dia a dia", cats:[{k:"mercado",n:"Mercado",c:"--c7"},{k:"transporte",n:"Transporte",c:"--c5"},{k:"saude",n:"Saúde",c:"--c2"},{k:"lazer",n:"Lazer",c:"--c6"},{k:"extras",n:"Gastos extras",c:"--c2"}]},
  {t:"Outros", cats:[{k:"faculdade",n:"Faculdade",c:"--c4"},{k:"cartao",n:"Cartão de crédito",c:"--c6"},{k:"cambio",n:"Taxas e câmbio",c:"--c5"},{k:"outros",n:"Outros",c:"--c8"}]}];
const CATS_OUT = GROUPS_AR.flatMap(g=>g.cats);
const CASA = new Set(["luz","agua","gas","internet","abl","contas"]);
const CATS_IN = [{k:"pai",n:"Dinheiro do pai",c:"--c7"},{k:"freela",n:"Renda extra",c:"--c3"},{k:"outros_in",n:"Outras entradas",c:"--c8"}];
const CATS_BR = [{k:"cartao_br",n:"Cartão",c:"--c6"},{k:"energia",n:"Energia",c:"--c5"},{k:"agua_br",n:"Água",c:"--c3"},
  {k:"internet_br",n:"Internet",c:"--c4"},{k:"celular",n:"Celular",c:"--c3"},{k:"plano",n:"Plano de saúde",c:"--c2"},
  {k:"faculdade_br",n:"Faculdade",c:"--c4"},{k:"emprestimo",n:"Empréstimo",c:"--c5"},{k:"assinaturas",n:"Assinaturas",c:"--c7"},{k:"outros_br",n:"Outros",c:"--c8"}];
const CAT = Object.fromEntries([{k:"contas",n:"Luz, água, internet",c:"--c3"},{k:"casa",n:"Contas da casa",c:"--c1"},{k:"salario",n:"Salário",c:"--c7"},...CATS_OUT,...CATS_IN,...CATS_BR].map(c=>[c.k,c]));
function catFor(x,c){ return CAT[x.categoria] || (c===BR ? CAT.outros_br : x.tipo==="receita" ? CAT.outros_in : CAT.outros); }
const initials = n => n.replace(/\(.*\)/,"").split(/[\s,]+/).filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join("").toUpperCase() || n.slice(0,2).toUpperCase();

// ---------- moedas ----------
const NUM2 = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const NUMP = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
const CMP = new Intl.NumberFormat("pt-BR",{notation:"compact",maximumFractionDigits:1});
const SYM = {ARS:"$", BRL:"R$"};
const fmtM = (c,m) => { c = Math.round(c||0); const s=(m==="BRL"?NUM2:NUMP).format(Math.abs(c)/100); return (c<0?"− ":"")+SYM[m]+" "+s; };
const fmtC = (c,m) => { c = Math.round(c||0); const v=Math.abs(c)/100; const s = v>=10000 ? CMP.format(v) : (m==="BRL"?NUM2:NUMP).format(v); return (c<0?"− ":"")+SYM[m]+" "+s; };
const ars = c => fmtM(c,"ARS"), brl = c => fmtM(c,"BRL");
const moedaOf = x => x.moeda==="BRL" ? "BRL" : "ARS";
const conv = (c, from, to, rate) => from===to ? c : !rate ? null : to==="ARS" ? c*rate : c/rate;
const fmtRate = r => "$ "+NUMP.format(Math.round(Number(r)*100)/100);

// ---------- datas e utilidades ----------
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const addDays = (iso,n) => { const [y,m,d]=iso.split("-").map(Number); const t=new Date(y,m-1,d+n); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const monthOf = iso => iso.slice(0,7);
const shiftMonth = (m,delta) => { let [y,mo]=m.split("-").map(Number); mo+=delta; while(mo<1){mo+=12;y--} while(mo>12){mo-=12;y++} return `${y}-${pad(mo)}`; };
const daysIn = m => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo,0).getDate(); };
const dt = m => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1); };
const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
const monthName = m => cap(new Intl.DateTimeFormat("pt-BR",{month:"long"}).format(dt(m)))+" "+m.slice(0,4);
const monthShort = m => new Intl.DateTimeFormat("pt-BR",{month:"long"}).format(dt(m));
const monthAbbr = m => cap(new Intl.DateTimeFormat("pt-BR",{month:"short"}).format(dt(m)).replace(".",""))+"/"+m.slice(2,4);
const dayName = iso => { const [y,mo,d]=iso.split("-").map(Number); return cap(new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"numeric",month:"short"}).format(new Date(y,mo-1,d)).replace(".","")); };
const shortDate = iso => { const [y,mo,d]=iso.split("-").map(Number); return new Intl.DateTimeFormat("pt-BR",{day:"numeric",month:"short"}).format(new Date(y,mo-1,d)).replace(".",""); };
function parseMoney(s){
  s = String(s||"").replace(/[R$\s]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const v = Number(s);
  return isFinite(v) ? Math.round(v*100) : NaN;
}
const parseRate = s => { const v = parseMoney(s); return isNaN(v) ? NaN : v/100; };
const centsToInput = c => { const v=Math.round(c)/100; return (Number.isInteger(v)? String(v) : v.toFixed(2)).replace(".",","); };
const rateToInput = r => String(Math.round(r*100)/100).replace(".",",");
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k==="text") e.textContent=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==false && v!=null) e.setAttribute(k,v===true?"":v); }
  for(const k of kids) if(k!=null && k!==false) e.append(k); return e; };
const svgEl = (tag, attrs={}) => { const e=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); return e; };
function toast(msg){ const h=document.getElementById("toastHost"); h.replaceChildren(el("div",{class:"toast",role:"status",text:msg})); clearTimeout(toast.t); toast.t=setTimeout(()=>h.replaceChildren(),2300); }
const status = x => x.naoPagar ? "nao" : x.pago ? "paga" : "apagar";
const dateOf = (x,c) => c===BR ? x.vencimento : x.data;
const isOut = (x,c) => c===BR || x.tipo!=="receita";
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

// ---------- carinhas ----------
function moodMonth(ent, sai){
  if(!ent && !sai) return {f:"🙂", t:"Comece lançando"};
  if(!ent) return {f:"😟", t:"Falta lançar o que entrou"};
  const r = sai/ent;
  if(r<=0.7) return {f:"😄", t:"Mandou bem! Está sobrando"};
  if(r<=0.9) return {f:"🙂", t:"Tá indo bem"};
  if(r<=1) return {f:"😬", t:"No limite"};
  return {f:"😢", t:"Gastou mais do que entrou"};
}
function faceEl(m){ return el("div",{class:"face"}, el("span",{"aria-hidden":"true",text:m.f}), m.t ? el("small",{text:m.t}) : null); }

// ---------- armazenamento ----------
const LKEY = "jujuFinancas.v2";
const match = (x,flt) => flt.every(([f,op,v]) => op==="==" ? x[f]===v : op===">=" ? x[f]>=v : op==="<=" ? x[f]<=v : true);
const localStore = {
  mode:"local", subs:new Set(),
  load(){ try{ const s=JSON.parse(localStorage.getItem(LKEY)); if(s && s.lancamentos) return s; }catch(e){} return {lancamentos:{},brasil:{},config:{}}; },
  save(s){ try{ localStorage.setItem(LKEY,JSON.stringify(s)); }catch(e){} for(const f of this.subs) f(s); },
  rows(s,c,flt){ return Object.entries(s[c]).map(([id,v])=>({id,...v})).filter(x=>match(x,flt)); },
  watch(c,flt,cb){ const f=s=>cb(this.rows(s,c,flt),null); this.subs.add(f); f(this.load()); return ()=>this.subs.delete(f); },
  async query(c,flt){ return this.rows(this.load(),c,flt); },
  async add(c,o){ const s=this.load(); s[c]["l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)]=o; this.save(s); },
  async update(c,id,p){ const s=this.load(); if(s[c][id]) Object.assign(s[c][id],p); this.save(s); },
  async remove(c,id){ const s=this.load(); delete s[c][id]; this.save(s); },
  watchConfig(k,cb){ const f=s=>cb(s.config[k]||{}); this.subs.add(f); f(this.load()); return ()=>this.subs.delete(f); },
  async setConfig(k,v){ const s=this.load(); s.config[k]=v; this.save(s); }
};
function dbStore(db){
  const q = (c,flt) => flt.reduce((qq,[f,op,v])=>qq.where(f,op,v), db.collection(c));
  const rows = s => s.docs.map(d=>({id:d.id,...d.data()}));
  return { mode:"db",
    watch:(c,flt,cb,err)=>q(c,flt).onSnapshot(s=>cb(rows(s),s.metadata), err||(()=>{})),
    query:async(c,flt)=>rows(await q(c,flt).get()),
    add:(c,o)=>db.collection(c).add(o), update:(c,id,p)=>db.collection(c).doc(id).update(p), remove:(c,id)=>db.collection(c).doc(id).delete(),
    watchConfig:(k,cb)=>db.doc("config/"+k).onSnapshot(s=>cb(s.exists ? s.data() : {}), ()=>{}),
    setConfig:(k,v)=>db.doc("config/"+k).set(v) };
}

// ---------- estado ----------
const S = { mes: monthOf(today()), tab:"I", sub:"L", owner:true, ready:false,
  ar:{items:[],loading:true,prevFixas:[]}, br:{items:[],loading:true,prevFixas:[]},
  parc:{ar:[],br:[]}, ex:{ar:[],br:[]}, limites:{}, taxas:{}, meta:0, cmp:null, cmpMoeda:"BRL", cmpSel:null,
  busca:"", all:null, allLoading:false, slow:false, err:false };
let store = null, monthSubs = [], loadTimer = null, pendingRender = false, downloads = null;
function lastRateBefore(m){ const ks = Object.keys(S.taxas).filter(k=>k<m && Number(S.taxas[k])>0).sort(); return ks.length ? {mes:ks[ks.length-1], v:Number(S.taxas[ks[ks.length-1]])} : null; }
function lastRate(){ const ks = Object.keys(S.taxas).filter(k=>Number(S.taxas[k])>0).sort(); return ks.length ? Number(S.taxas[ks[ks.length-1]]) : 0; }
const rateOf = m => Number(S.taxas[m]) || (lastRateBefore(m)||{}).v || lastRate() || 0;
const entryRate = (x,c) => (c===AR && Number(x.cotacao)>0) ? Number(x.cotacao) : rateOf(x.mes);

function subscribeMonth(){
  monthSubs.forEach(f=>f()); monthSubs=[];
  const mes = S.mes;
  S.ar = {items:[],loading:true,prevFixas:[]}; S.br = {items:[],loading:true,prevFixas:[]};
  clearTimeout(loadTimer); S.slow=false;
  loadTimer = setTimeout(()=>{ S.slow=true; render(); },10000);
  for(const [key,c] of [["ar",AR],["br",BR]]){
    monthSubs.push(store.watch(c,[["mes","==",mes]],(rows,meta)=>{
      if(mes!==S.mes) return;
      S[key].items=rows; S[key].loading=false;
      if(!meta || !meta.fromCache){ clearTimeout(loadTimer); S.slow=false; }
      render();
    }, ()=>{ clearTimeout(loadTimer); S.err=true; S[key].loading=false; render(); }));
    store.query(c,[["mes","==",shiftMonth(mes,-1)]]).then(r=>{ if(mes===S.mes){ S[key].prevFixas=r.filter(x=>x.fixo && !x.parcelado); render(); } }).catch(()=>{});
  }
  render();
  if(S.tab==="C") loadCmp();
}

// cotação média do mês = total em pesos ÷ total em reais das trocas com cotação
async function refreshMonthRate(m){
  try{
    const rows = (await store.query(AR,[["mes","==",m]])).filter(x=>Number(x.cotacao)>0);
    let p=0, r=0;
    for(const x of rows){ const k=Number(x.cotacao); if(moedaOf(x)==="ARS"){ p+=x.valor; r+=x.valor/k; } else { p+=x.valor*k; r+=x.valor; } }
    const avg = r>0 ? Math.round(p/r*100)/100 : 0;
    const cur = Number(S.taxas[m])||0;
    if(avg && Math.abs(avg-cur)>=0.01) await store.setConfig("cotacoes",{taxas:{...S.taxas,[m]:avg}});
  }catch(_){}
}
function rateInfo(items){
  const rs = items.filter(x=>Number(x.cotacao)>0).map(x=>Number(x.cotacao));
  return {n:rs.length, min:rs.length?Math.min(...rs):0, max:rs.length?Math.max(...rs):0};
}

// ---------- totais ----------
function totalsAR(items, moeda="ARS"){
  let ent=0, sai=0, pend=0, nao=0, semTaxa=0;
  for(const x of items){
    const v = conv(x.valor, moedaOf(x), moeda, entryRate(x,AR));
    if(v==null){ semTaxa++; continue; }
    if(x.tipo==="receita") ent+=v;
    else if(x.naoPagar) nao+=v;
    else { sai+=v; if(!x.pago) pend+=v; }
  }
  return {ent,sai,pend,nao,semTaxa};
}
function totalsBR(items){
  let total=0, pago=0, nao=0, late=0, open=0; const hoje=today();
  for(const x of items){
    if(x.naoPagar){ nao+=x.valor; continue; }
    total+=x.valor;
    if(x.pago) pago+=x.valor; else { open++; if(x.vencimento<hoje) late++; }
  }
  return {total,pago,falta:total-pago,nao,late,open,count:items.length};
}
function catTotalsAR(items, moeda="ARS", agruparCasa=false){
  const o = {};
  for(const x of items) if(x.tipo!=="receita" && !x.naoPagar){
    const v = conv(x.valor,moedaOf(x),moeda,entryRate(x,AR)); if(v==null) continue;
    const k = agruparCasa && CASA.has(x.categoria) ? "casa" : x.categoria;
    o[k]=(o[k]||0)+v;
  }
  return o;
}

// ---------- conferência automática ----------
function findIssues(){
  const out = [], hoje = today();
  const all = [...S.ar.items.map(x=>({x,c:AR})), ...S.br.items.map(x=>({x,c:BR}))];
  const nome = it => (it.x.descricao || catFor(it.x,it.c).n).replace(/ \(exemplo\)$/,"");
  const seen = {};
  for(const it of all){ const k = [it.c, it.x.valor, it.x.categoria, dateOf(it.x,it.c), it.x.tipo||""].join("|");
    if(seen[k]) out.push({i:"👯", t:`Parece repetido: "${nome(it)}" de ${fmtM(it.x.valor, it.c===BR?"BRL":moedaOf(it.x))} aparece duas vezes em ${shortDate(dateOf(it.x,it.c))}.`, a:"Abrir para conferir", it});
    else seen[k]=true; }
  const ref = Number(S.taxas[S.mes]) || lastRate();
  if(ref) for(const x of S.ar.items.filter(x=>Number(x.cotacao)>0)){ const d = Number(x.cotacao)/ref; if(d>1.25 || d<0.8)
    out.push({i:"💱", t:`A cotação de "${nome({x,c:AR})}" (${fmtRate(x.cotacao)}) está bem diferente da média (${fmtRate(ref)}). ${d<0.2||d>5?"Será que sobrou ou faltou um zero?":"Confere se digitou certo."}`, a:"Corrigir", it:{x,c:AR}}); }
  for(const it of all){ const m = it.c===BR ? "BRL" : moedaOf(it.x);
    if(m==="ARS" && it.x.valor < 50000 && isOut(it.x,it.c)) out.push({i:"🤔", t:`"${nome(it)}": ${ars(it.x.valor)} parece pouco para pesos. Será que era em reais?`, a:"Corrigir", it});
    if(m==="BRL" && it.x.valor > 3000000 && it.c===AR && isOut(it.x,it.c)) out.push({i:"🤔", t:`"${nome(it)}": ${brl(it.x.valor)} é muito para reais. Será que era em pesos?`, a:"Corrigir", it}); }
  const sem = S.ar.items.filter(x=>!(Number(x.cotacao)>0) && !x.exemplo && !x.parcelado);
  if(sem.length) out.push({i:"📝", t:`${sem.length} lançamento(s) sem a cotação da troca. O app está usando a média do mês para eles.`, a:"Abrir o primeiro", it:{x:sem[0],c:AR}});
  const late = all.filter(it=>isOut(it.x,it.c) && status(it.x)==="apagar" && dateOf(it.x,it.c)<hoje);
  if(late.length) out.push({i:"⏰", t: late.length===1 ? `"${nome(late[0])}" venceu em ${shortDate(dateOf(late[0].x,late[0].c))} e não está marcada como paga.` : `${late.length} contas passaram do vencimento sem estar pagas.`, a:"Ver", it:late[0]});
  const by = catTotalsAR(S.ar.items);
  for(const [k,lim] of Object.entries(S.limites)) if(lim && by[k]>lim) out.push({i:"😢", t:`${(CAT[k]||CAT.outros).n} passou do limite: ${ars(by[k])} de ${ars(lim)}.`, a:null});
  return out;
}

// ---------- render ----------
const viewEl = document.getElementById("view");
viewEl.addEventListener("focusout",()=>setTimeout(()=>{ if(pendingRender) render(); },0));
function render(){
  if(!S.ready) return;
  const a = document.activeElement;
  if(a && a.tagName==="INPUT" && viewEl.contains(a)){ pendingRender=true; return; }
  pendingRender=false;

    L.push(`💌 Recebi de você: ${[somaB?brl(somaB):"", somaP?ars(somaP):""].filter(Boolean).join(" + ")}`, ""); }

    for(const x of [...S.br.items].sort((a,b)=>a.vencimento.localeCompare(b.vencimento))){

      L.push(`${st==="paga"?"✅":st==="nao"?"🚫":"⏳"} ${n}: ${brl(x.valor)}${st==="paga"?" (paga)":st==="nao"?" (não vou pagar)":` (vence ${shortDate(x.vencimento)})`}`);

async function baixarPlanilha(){
  toast("Preparando a planilha…");
  try{
    const [a,b] = await Promise.all([store.query(AR,[]), store.query(BR,[])]);
    const q = v => { v = v==null ? "" : String(v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const n = c => NUM2.format(c/100);
    const lines = [["Onde","Tipo","Data","Mês","Descrição","Categoria","Moeda","Valor","Cotação (R$1 = $)","Valor em reais","Situação","Fixa","Parcela"].join(";")];
    const rows = [...a.map(x=>({x,c:AR})), ...b.map(x=>({x,c:BR}))].sort((p,r)=>dateOf(p.x,p.c).localeCompare(dateOf(r.x,r.c)));
    for(const {x,c} of rows){
      const m = c===BR ? "BRL" : moedaOf(x), reais = conv(x.valor,m,"BRL",entryRate(x,c));
      lines.push([c===BR?"Brasil":"Argentina", isOut(x,c)?"Saída":"Entrada", dateOf(x,c), x.mes, x.descricao||"", catFor(x,c).n, m==="BRL"?"Reais":"Pesos",
        n(x.valor), c===AR&&Number(x.cotacao)>0 ? NUMP.format(x.cotacao) : "", reais!=null ? n(reais) : "",
        !isOut(x,c) ? "" : status(x)==="paga"?"Paga":status(x)==="nao"?"Não vou pagar":"A pagar", x.fixo?"Sim":"", x.parcelado?`${x.parcela}/${x.parcelas}`:""].map(q).join(";"));
    }
    const name = `juju-financas-${today()}.csv`, file = new File(["\ufeff"+lines.join("\r\n")], name, {type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Juju Finanças"}); toast("Planilha pronta ✅"); }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),8000); toast("Planilha baixada ✅"); }

      if(!vb){ d="novo"; cls="muted"; } else { const p=(va/vb-1)*100; d = Math.abs(p)<1 ? "=" : `${p>0?"▲":"▼"} ${NUMP.format(Math.abs(p).toFixed(0))}%`; cls = p>=1 ? "out" : p<=-1 ? "in" : "muted"; }
      list.append(el("div",{class:"cmprow"},
        el("span",{class:"n"}, name, el("small",{class:"num",text:`${monthShort(cur.m)} ${fmtM(va,M)} · ${monthShort(prev.m)} ${fmtM(vb,M)}`})),
        el("span",{class:"d num "+cls,text:d})));
    }
    out.push(el("h3",{class:"sectitle",text:`Categorias: ${monthShort(cur.m)} × ${monthShort(prev.m)}`}), list);
  }
  return out;
}

  }

  const title = editing ? (item.parcelado ? `Parcela ${item.parcela} de ${item.parcelas}` : "Editar lançamento") : "Novo lançamento";
  const form = el("form",{class:"sheet",role:"dialog","aria-modal":"true","aria-labelledby":"sheetTitle"},
    el("div",{class:"bar"}, el("h2",{id:"sheetTitle",text:title}), el("button",{type:"button","aria-label":"Fechar",text:"✕",onclick:close})),
    onde, tipo, moeda,
    el("div",{class:"f"}, valorLbl, el("div",{class:"money"}, sym, valor)), hint,

    el("label",{class:"f"}, "Descrição (opcional)", desc),
    el("label",{class:"f"}, dataLbl, data),
    statWrap,
    el("div",{class:"checks"}, parcRow, fixoRow), parcBox,

  form.onsubmit = async ev => {
    ev.preventDefault(); err.textContent="";

    const c = f.c, date = data.value, o = {valor:v, descricao:desc.value.trim(), categoria:f.categoria, mes:monthOf(date)};
    if(c===AR){
      o.tipo=f.tipo; o.moeda=f.moeda; o.data=date;
      const r = parseRate(cot.value);
      if(r>0) o.cotacao = Math.round(r*100)/100;
      else if(cot.value.trim()){ err.textContent="A cotação não está certa. Exemplo: 280 ou 281,50."; cot.focus(); return; }
      else if(editing) o.cotacao = 0;
    } else o.vencimento=date;
    o.pago = out() ? f.status==="paga" : true; o.naoPagar = out() && f.status==="nao";
    let n=0, a=1;
    if(f.parcelar && !editing){
      n = parseInt(nParc.value,10); a = parseInt(atual.value,10)||1;
      if(!(n>=2 && n<=72)){ err.textContent="Em quantas vezes? Use um número de 2 a 72."; nParc.focus(); return; }
      if(!(a>=1 && a<=n)){ err.textContent=`A parcela atual precisa ser de 1 a ${n}.`; atual.focus(); return; }
    } else if(!item?.parcelado) o.fixo = fixo.checked;
    const w = checks(o);
    if(w.length && !f.confirmed){
      f.confirmed = true;
      warnBox.replaceChildren(...w.map(t=>el("span",{text:"🤔 "+t})), el("span",{style:"font-weight:600;color:var(--muted)",text:"Se estiver tudo certo, toque em salvar de novo."}));
      warnBox.hidden = false; saveBtn.textContent = "Está certo, salvar"; warnBox.scrollIntoView({block:"nearest"}); return;
    }
    saveBtn.disabled = true; saveBtn.textContent = "Salvando…";
    try{
      if(editing){ if(item.exemplo){ o.exemplo=false; o.descricao = o.descricao.replace(/ \(exemplo\)$/,""); } await store.update(c,item.id,o); }
      else if(n){
        const grupo = "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), dia = Number(date.slice(8,10)), base = monthOf(date);
        for(let i=a;i<=n;i++){
          const off = i-a, mes = shiftMonth(base,off), d = `${mes}-${pad(Math.min(dia,daysIn(mes)))}`;
          const p = {...o, mes, parcelado:true, grupo, parcela:i, parcelas:n, fixo:false, criadoEm:Date.now()+off};
          if(c===AR) p.data=d; else p.vencimento=d;
          if(off>0){ p.pago=false; p.naoPagar=false; if(c===AR) delete p.cotacao; }
          await store.add(c,p);
        }
      } else { o.criadoEm=Date.now(); await store.add(c,o); }
      close();
      S.all = null;
      if(c===AR){ refreshMonthRate(o.mes); if(editing && item.mes!==o.mes) refreshMonthRate(item.mes); }
      if(o.mes!==S.mes){ S.mes=o.mes; subscribeMonth(); }
      toast(editing ? "Alterações salvas 🌸" : n ? `${n-a+1} parcelas lançadas 🌸` : "Lançado! 🌸");
    }catch(e){ saveBtn.disabled=false; saveBtn.textContent=editing?"Salvar alterações":"Lançar";
      err.textContent = e && e.code==="quota_exceeded" ? "O espaço de armazenamento acabou. Apague lançamentos antigos." : "Não consegui salvar. Confira a internet e tente de novo."; }
  };
  const scrim = el("div",{class:"scrim",onclick:e=>{ if(e.target===scrim) close(); }}, form);
  host.replaceChildren(scrim);
  paint(); syncOutro();
  if(!editing) valor.focus();
}

// ---------- nuvem (Firebase Realtime Database) ----------
function rtdbStore(ref){
  let snap = {lancamentos:{},brasil:{},config:{}}, loaded = false;
  const waiters = [], subs = new Set();
  ref.on("value", s=>{
    const v = s.val() || {};
    snap = {lancamentos:v.lancamentos||{}, brasil:v.brasil||{}, config:v.config||{}};
    loaded = true; S.err = false;
    waiters.splice(0).forEach(f=>f());
    for(const f of subs) f(snap);
  }, e=>{
    S.err = true; clearTimeout(loadTimer);
    S.errMsg = /permission/i.test(String(e && (e.code||e.message))) ? "O Firebase não deixou ler seus dados. Confira se colou as regras no Realtime Database (aba Regras) e tocou em Publicar." : "Não consegui falar com o Firebase. Confira a internet.";
    S.ar.loading=false; S.br.loading=false; render();
  });
  const ready = () => loaded ? Promise.resolve() : new Promise(r=>waiters.push(r));
  const rows = (c,flt) => Object.entries(snap[c]||{}).map(([id,v])=>({id,...v})).filter(x=>match(x,flt));
  const clean = o => JSON.parse(JSON.stringify(o));   // o Firebase não aceita campos vazios (undefined)
  return { mode:"cloud",
    watch(c,flt,cb){ const f=()=>cb(rows(c,flt),{fromCache:false}); subs.add(f); if(loaded) f(); return ()=>subs.delete(f); },
    async query(c,flt){ await ready(); return rows(c,flt); },
    add:(c,o)=>ref.child(c).push(clean(o)),
    update:(c,id,p)=>ref.child(c+"/"+id).update(clean(p)),
    remove:(c,id)=>ref.child(c+"/"+id).remove(),
    watchConfig(k,cb){ const f=()=>cb(snap.config[k]||{}); subs.add(f); if(loaded) f(); return ()=>subs.delete(f); },
    setConfig:(k,v)=>ref.child("config/"+k).set(clean(v)) };
}

      el("li",{}, "No menu, abra ", el("b",{text:"Criação → Realtime Database"}), " → ", el("b",{text:"Criar banco de dados"}), " → escolha um local → ", el("b",{text:"Iniciar no modo bloqueado"}), " → ", el("b",{text:"Ativar"}), ". Depois abra a aba ", el("b",{text:"Regras"}), ", apague tudo, cole as regras abaixo e toque em ", el("b",{text:"Publicar"}), ".")),
    rules, copyR,
    el("ol",{start:"5"},
      el("li",{}, "Toque na ", el("b",{text:"engrenagem ⚙️ → Configurações do projeto"}), ". Em ", el("b",{text:"Seus apps"}), ", toque no ícone ", el("code",{text:"</>"}), ", dê o nome ", el("b",{text:"Juju Finanças"}), " e toque em ", el("b",{text:"Registrar app"}), "."),
      el("li",{}, "Vai aparecer um bloco de texto. Copie a parte de dentro das chaves, de ", el("code",{text:"apiKey"}), " até o último ", el("code",{text:"}"}), ", e cole aqui:")),
    ta, err, el("button",{class:"btn",text:"Salvar e continuar"}));
  form.onsubmit = e => {
    e.preventDefault();
    const c = parseCfg(ta.value);
    if(!c.apiKey || !c.projectId){ err.textContent = "Não encontrei o apiKey e o projectId no que você colou. Copie o bloco inteiro de novo (passo 6)."; return; }
    if(!c.databaseURL){ err.textContent = "Falta o databaseURL. Crie o Realtime Database (passo 4), depois volte em Configurações do projeto e copie o bloco de novo."; return; }
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(_){ err.textContent = "O navegador não deixou salvar. Saia do modo anônimo e tente de novo."; return; }
    location.reload();
  };
  viewEl.replaceChildren(form);
}

function gateLogin(msg){
  S.ready = false; chrome(false);
  const email = el("input",{id:"lgEmail",type:"email",autocomplete:"username",autocapitalize:"off",placeholder:"seu@email.com","aria-label":"E-mail",inputmode:"email"});
  const senha = el("input",{id:"lgSenha",type:"password",autocomplete:"current-password",placeholder:"6 caracteres ou mais","aria-label":"Senha"});
  const err = el("p",{class:"err",role:"alert",text:msg||""});
  const entrar = el("button",{class:"btn",text:"Entrar"});
  const criar = el("button",{class:"btn ghost",type:"button",text:"Criar minha conta"});
  const traduz = e => { const c = (e && e.code) || "";
    if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "E-mail ou senha errados. Se é a primeira vez, toque em Criar minha conta.";
    if(/invalid-email/.test(c)) return "Esse e-mail não parece certo. Confira.";
    if(/weak-password/.test(c)) return "A senha precisa ter 6 caracteres ou mais.";
    if(/email-already-in-use/.test(c)) return "Esse e-mail já tem conta. Toque em Entrar.";
    if(/operation-not-allowed/.test(c)) return "O login por e-mail e senha não está ativado no Firebase. Faça o passo 3 da configuração.";
    if(/too-many-requests/.test(c)) return "Muitas tentativas. Espere alguns minutos.";
    if(/network/.test(c)) return "Sem internet. Confira a conexão.";
    if(/api-key|configuration/.test(c)) return "A configuração do Firebase está errada. Toque em Trocar configuração e cole de novo.";
    return "Não deu certo: " + (c || "erro desconhecido"); };
  const go = async (fn) => { err.textContent=""; const e1=email.value.trim(), s1=senha.value;
    if(!e1 || !s1){ err.textContent = "Preencha o e-mail e a senha."; return; }
    entrar.disabled = criar.disabled = true;
    try{ await fn(e1,s1); }catch(e){ err.textContent = traduz(e); entrar.disabled = criar.disabled = false; } };
  criar.onclick = () => go((e1,s1)=>firebase.auth().createUserWithEmailAndPassword(e1,s1));
  const form = el("form",{class:"card gate"},
    logo(),
    el("h2",{text:"Oi, Juju 🌸"}),
    el("p",{class:"muted",text:"Entre com seu e-mail e senha. Na primeira vez, toque em Criar minha conta: ela fica só sua, e o app lembra de você."}),
    el("label",{class:"f"}, "E-mail", email), el("label",{class:"f"}, "Senha", senha),
    err, entrar, criar,
    el("button",{class:"link",type:"button",text:"Trocar configuração do Firebase",onclick:()=>{ try{ localStorage.removeItem(CFG_KEY); }catch(_){} location.reload(); }}));
  form.onsubmit = e => { e.preventDefault(); go((e1,s1)=>firebase.auth().signInWithEmailAndPassword(e1,s1)); };
  viewEl.replaceChildren(form);
}

function openConta(){
  const host = document.getElementById("sheetHost"), close = () => host.replaceChildren();
  const u = firebase.auth().currentUser;
  const sheet = el("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-labelledby":"cTitle"},
    el("div",{class:"bar"}, el("h2",{id:"cTitle",text:"Minha conta"}), el("button",{type:"button","aria-label":"Fechar",text:"✕",onclick:close})),
    el("p",{style:"margin:0"}, "Conectada como ", el("b",{text:u ? u.email : "—"})),
    el("p",{class:"muted",style:"margin:0",text:"Seus dados ficam no seu Firebase e só abrem com essa senha. Em outro celular, é só instalar o app e entrar com o mesmo e-mail."}),
    el("div",{class:"actions"},
      el("button",{class:"btn ghost",type:"button",text:"Sair",onclick:()=>firebase.auth().signOut().then(()=>location.reload())})));
  const scrim = el("div",{class:"scrim",onclick:e=>{ if(e.target===scrim) close(); }}, sheet);
  host.replaceChildren(scrim);
}

function startApp(user){
  store = rtdbStore(firebase.database().ref("users/"+user.uid));
  S.ready = true; chrome(true);
  store.watchConfig("limites", d=>{ S.limites=d.limites||{}; render(); });
  store.watchConfig("cotacoes", d=>{ S.taxas=d.taxas||{}; render(); });
  store.watchConfig("meta", d=>{ S.meta=Number(d.mensal)||0; render(); });
  store.watch(AR,[["parcelado","==",true]], r=>{ S.parc.ar=r; render(); });
  store.watch(BR,[["parcelado","==",true]], r=>{ S.parc.br=r; render(); });
  subscribeMonth();
}

// ---------- abrir o app ----------
chrome(false);
(function boot(){
  const cfg = getCfg();
  if(!cfg){ gateSetup(); return; }
  if(!window.firebase){ viewEl.replaceChildren(el("div",{class:"empty"}, el("div",{class:"big",text:"📶"}), el("h2",{text:"Sem internet"}), el("p",{text:"O Juju Finanças precisa de internet para buscar seus dados. Conecte e abra de novo."}), el("button",{class:"btn",text:"Tentar de novo",onclick:()=>location.reload()}))); return; }
  try{ if(!firebase.apps.length) firebase.initializeApp(cfg); }
  catch(e){ try{ localStorage.removeItem(CFG_KEY); }catch(_){} gateSetup("Essa configuração não funcionou. Copie o bloco do Firebase de novo."); return; }
  let started = false;
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){ if(started) location.reload(); else gateLogin(); return; }
    if(!started){ started = true; startApp(u); }
  });
})();
})();
</script>
